[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfield-studio"
version = "0.1.0"
description = "Open-source cinematic direction, motion transfer, and identity-safe media workflows for ComfyUI."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "requests>=2.32",
  "Pillow>=10",
]

[project.optional-dependencies]
platform = ["comfy-sdk>=0.5"]
identity = ["opencv-python>=4.10", "numpy>=1.26"]

[tool.setuptools]
packages = ["openfield", "openfield.services"]
