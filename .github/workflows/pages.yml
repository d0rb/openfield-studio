name: pages

# Builds the hosted Replay (plain files: the app plus the recorded takes) and publishes it to GitHub Pages.
# It needs recorded takes in openfield/web/showcase/takes; `openfield export-static` stops with a clear message if there are none.
# Turn Pages on once in the repository settings (Build and deployment: GitHub Actions).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "openfield/web/**"
      - "openfield/static_export.py"
      - "showcase/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Build the hosted Replay
        run: openfield export-static --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
