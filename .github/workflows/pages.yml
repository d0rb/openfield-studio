name: pages

# Builds the hosted Replay (plain files: the app plus the recorded takes) and publishes it to GitHub Pages.
# It needs recorded takes in openfield/web/showcase/takes; `openfield export-static` stops with a clear message if there are none.
# Turn Pages on once in the repository settings (Build and deployment: GitHub Actions).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "openfield/web/**"
      - "openfield/static_export.py"
      - "openfield/share.py"
      - "openfield/engine/rig.py"
      - "openfield/engine/audit.py"
      - "openfield/__init__.py"
      - "showcase/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the hosted Replay
        # OPENFIELD_SITE_PASSWORD puts a password in front of the page. Set it as a repository secret named
        # SITE_PASSWORD to turn it on; with no secret the site is open, exactly as before. It is a latch, not a lock:
        # a static host serves files to whoever asks, so every take and receipt stays reachable by its own URL.
        env:
          OPENFIELD_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: openfield export-static --out site --site-url "${{ steps.pages.outputs.base_url }}/" --repo-url "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
